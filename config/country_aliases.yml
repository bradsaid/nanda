# Common misspellings and alternate names for filming locations, from Search Console queries.
#
#   Canonical country (as stored in locations.country, case-insensitive): [alias, ...]
#
# What they do (see CountryAliases):
#   * /episodes/by_country/<alias> 301s to the canonical country page (unknown names still 404);
#   * the country page shows "Also spelled / also known as: ..." and works the aliases into
#     its meta description when they fit in 160 characters;
#   * the Locations search ("Search country...") also matches the aliases.
#
# Only list a name that cannot be mistaken for another place. A real country name always wins
# over an alias with the same slug, and an alias for a country with no episodes is ignored.
Colombia:
  - Columbia
Philippines:
  - Phillipines
  - Philipines
  - Phillippines
India:
  - Indian
Trinidad:
  - Trinidad and Tobago
  - Trinidad & Tobago
Tobago:
  - Trinidad and Tobago
  - Trinidad & Tobago
Australia:
  - Australian
Brazil:
  - Brasil
Mexico:
  - México
Bahamas:
  - The Bahamas
