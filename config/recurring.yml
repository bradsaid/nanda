# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

# No recurring tasks. Solid Queue runs inside Puma on a single 512MB dyno, and
# a recurring schedule costs a whole extra forked Ruby process (the Scheduler)
# purely to run one cleanup an hour. That cleanup now runs from the Heroku
# Scheduler add-on instead, which the app already uses for cache:warm_items:
#
#   bin/rails solid_queue:clear_finished   (hourly)
#
production: {}
